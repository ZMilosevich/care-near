<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CareNear helps families find thoughtful, reliable caregiver visits close to home."
    />
    <meta name="theme-color" content="#F8F5EF" />
    <title>CareNear | Thoughtful care. Close to home.</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/fonts/Playfair-Display-SemiBold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/DM-Sans-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header" id="site-header">
      <a class="brand" href="#/" aria-label="CareNear home">
        <svg aria-hidden="true" viewBox="0 0 32 32">
          <path d="M16 28C8.3 23.8 4.8 18.2 6.4 12.3 7.7 7.7 12.7 6 16 10c3.3-4 8.3-2.3 9.6 2.3C27.2 18.2 23.7 23.8 16 28Z" />
          <path d="M16 10v12M11.5 14.5h9" />
        </svg>
        <span>CareNear</span>
      </a>
      <button
        class="menu-toggle icon-button"
        id="menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="primary-nav"
      >
        <span></span><span></span>
      </button>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary navigation">
        <a href="#/discover">Find care</a>
        <a href="#/#how-it-works">How it works</a>
        <a href="#/caregiver-onboarding">For caregivers</a>
        <a href="#/requests">Caregiver area</a>
        <a class="mobile-nav-only" href="#/visits">Visits</a>
      </nav>
      <div class="header-actions">
        <a class="text-link" href="#/visits">Visits</a>
        <a class="header-account" href="#/family-onboarding"
          >Create account</a
        >
      </div>
    </header>
    <main id="main-content" tabindex="-1"></main>
    <footer class="site-footer" id="site-footer"></footer>
    <div id="dialog-root"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="live-region sr-only" id="live-region" aria-live="polite"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
